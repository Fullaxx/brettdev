name: CI

# Every push to master or 24.04 builds brettdev and brettdev-full and pushes both to ghcr.io, tagged by branch:
#   master -> :latest, :26.04 and :resolute, the same images
#   24.04  -> :24.04 and :noble, the same images
# plus :<branch>-<short sha> for each build, which never moves. The codename tags name each release the
# way Ubuntu's own image does (ubuntu:resolute is ubuntu:26.04, ubuntu:noble is ubuntu:24.04).
# The same file is in master and 24.04 (a push runs the ci.yml of the pushed commit), so a CI change goes
# into both branches.
on:
  push:
    branches: [ master, "24.04" ]   # quoted, or YAML reads it as a number
  # Allows you to run this workflow by hand from the Actions tab (master and 24.04 only, see the job's if)
  workflow_dispatch:

# A newer push cancels the run still in progress on the same branch, so an
# older run can't finish last and leave older images on the tags
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # Only master and 24.04 publish, also when run by hand: each branch's Dockerfile.full builds FROM the
    # brettdev tag that this run makes on it (brettdev:latest on master, brettdev:24.04 on 24.04), which on
    # any other branch would be the published image instead of this run's
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/24.04'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # master is Ubuntu 26.04 (:latest, :26.04 and :resolute), 24.04 is 24.04 (:24.04 and :noble), plus
      # <branch>-<short sha> for each build (by branch name, so :latest stays with master even if GitHub's
      # default branch changes)
      - name: Tags and labels for brettdev
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fullaxx/brettdev
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=26.04,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=resolute,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=24.04,enable=${{ github.ref == 'refs/heads/24.04' }}
            type=raw,value=noble,enable=${{ github.ref == 'refs/heads/24.04' }}
            type=sha,prefix={{branch}}-

      - name: Tags and labels for brettdev-full
        id: meta_full
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fullaxx/brettdev-full
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=26.04,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=resolute,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=24.04,enable=${{ github.ref == 'refs/heads/24.04' }}
            type=raw,value=noble,enable=${{ github.ref == 'refs/heads/24.04' }}
            type=sha,prefix={{branch}}-
          labels: |
            org.opencontainers.image.title=brettdev-full

      # No Buildx and no layer cache: the default docker driver keeps brettdev in the
      # runner's image store, where Dockerfile.full's FROM finds it, and these images
      # are too big for the 10 GB Actions cache
      - name: Build and push brettdev
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push brettdev-full
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.full
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
