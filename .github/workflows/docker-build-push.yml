name: Build and Push to ghcr.io

on:
  push:
    branches:
      - master
  workflow_dispatch:

# A newer push cancels the run still in progress on the same branch, so an
# older run can't finish last and leave older images on the tags
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push brettdev
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/fullaxx/brettdev:latest

      - name: Build and push brettdev-full
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.full
          push: true
          tags: ghcr.io/fullaxx/brettdev-full:latest
